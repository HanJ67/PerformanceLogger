<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COM Poort Tekst Verzenden</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
        }

        textarea {
            width: 100%;
            height: 100px;
        }

        button {
            margin-top: 10px;
            margin-right: 10px;
            padding: 10px 15px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Tekst verzenden via COM-poort</h2>

<button id="connectBtn">COM-poort selecteren</button>

<div style="margin-top:20px;">
    <label for="message">Tekst (max 100 karakters):</label><br>
    <textarea id="message" maxlength="100"></textarea>
</div>

<button id="sendBtn" disabled>Versturen</button>

<div id="status">Niet verbonden</div>

<script>
let port;
let writer;

const connectBtn = document.getElementById("connectBtn");
const sendBtn = document.getElementById("sendBtn");
const statusDiv = document.getElementById("status");

connectBtn.addEventListener("click", async () => {
    try {
        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: 9600
        });

        writer = port.writable.getWriter();

        statusDiv.textContent = "Verbonden";
        sendBtn.disabled = false;

    } catch (err) {
        statusDiv.textContent = "Fout: " + err.message;
    }
});

sendBtn.addEventListener("click", async () => {
    const text = document.getElementById("message").value;

    if (text.length > 100) {
        alert("Maximaal 100 karakters toegestaan.");
        return;
    }

    if (!writer) {
        alert("Geen COM-poort verbonden.");
        return;
    }

    try {
        const encoder = new TextEncoder();
        await writer.write(encoder.encode(text + "\r\n"));

        statusDiv.textContent = `Verzonden (${text.length} karakters)`;
    } catch (err) {
        statusDiv.textContent = "Verzendfout: " + err.message;
    }
});
</script>

</body>
</html>
