<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COM Poort Terminal</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 20px auto;
    padding: 20px;
}

h2 {
    margin-top: 0;
}

label {
    font-weight: bold;
}

textarea {
    width: 100%;
    box-sizing: border-box;
}

#message {
    height: 80px;
}

#response {
    height: 250px;
    font-family: Consolas, monospace;
}

button, select {
    padding: 8px 12px;
    margin-top: 10px;
    margin-right: 10px;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>
<body>

<h2>COM Poort Terminal</h2>

<div>
    <label>Baudrate:</label>
    <select id="baudrate">
        <option value="9600">9600</option>
        <option value="19200">19200</option>
        <option value="38400">38400</option>
        <option value="57600">57600</option>
        <option value="115200" selected>115200</option>
    </select>

    <button id="connectBtn">COM-poort selecteren</button>
</div>

<div id="status">Niet verbonden</div>

<hr>

<label for="message">Tekst verzenden (max 100 karakters)</label>
<textarea id="message" maxlength="100"></textarea>

<br>

<button id="sendBtn" disabled>Versturen</button>

<hr>

<label for="response">Response</label>
<textarea id="response" readonly></textarea>

<br>

<button id="clearBtn">Response wissen</button>

<script>
let port = null;
let writer = null;
let reader = null;
let keepReading = false;

const connectBtn = document.getElementById("connectBtn");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const statusDiv = document.getElementById("status");
const responseBox = document.getElementById("response");

if (!("serial" in navigator)) {
    statusDiv.textContent =
        "Deze browser ondersteunt Web Serial niet. Gebruik Chrome of Edge.";
    connectBtn.disabled = true;
}

async function readSerial() {
    const decoder = new TextDecoder();

    while (port && port.readable && keepReading) {
        try {
            reader = port.readable.getReader();

            while (keepReading) {
                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                if (value) {
                    const text = decoder.decode(value);

                    responseBox.value += text;
                    responseBox.scrollTop =
                        responseBox.scrollHeight;
                }
            }
        } catch (error) {
            console.error(error);
            statusDiv.textContent =
                "Leesfout: " + error.message;
        } finally {
            if (reader) {
                reader.releaseLock();
            }
        }
    }
}

connectBtn.addEventListener("click", async () => {
    try {
        const baudRate =
            parseInt(document.getElementById("baudrate").value);

        port = await navigator.serial.requestPort();

        await port.open({
            baudRate: baudRate,
            dataBits: 8,
            stopBits: 1,
            parity: "none",
            flowControl: "none"
        });

        writer = port.writable.getWriter();

        keepReading = true;
        readSerial();

        sendBtn.disabled = false;

        statusDiv.textContent =
            "Verbonden @ " + baudRate + " baud";

    } catch (error) {
        statusDiv.textContent =
            "Verbindingsfout: " + error.message;
    }
});

sendBtn.addEventListener("click", async () => {
    const message =
        document.getElementById("message").value;

    if (!message.trim()) {
        alert("Voer eerst een bericht in.");
        return;
    }

    if (message.length > 100) {
        alert("Maximaal 100 karakters toegestaan.");
        return;
    }

    try {
        const encoder = new TextEncoder();

        await writer.write(
            encoder.encode(message + "\r\n")
        );

        statusDiv.textContent =
            "Verzonden (" + message.length + " karakters)";
    } catch (error) {
        statusDiv.textContent =
            "Verzendfout: " + error.message;
    }
});

clearBtn.addEventListener("click", () => {
    responseBox.value = "";
});

window.addEventListener("beforeunload", async () => {
    try {
        keepReading = false;

        if (reader) {
            await reader.cancel();
        }

        if (writer) {
            writer.releaseLock();
        }

        if (port) {
            await port.close();
        }
    } catch (e) {
        console.error(e);
    }
});
</script>

</body>
</html>
